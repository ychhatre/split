name: Run Database Migrations

on:
  # Manual trigger with database URL input
  workflow_dispatch:
    inputs:
      database_url:
        description: 'Database URL (postgresql://...)'
        required: true
        type: string
  
  # Auto-trigger on migration file changes
  push:
    branches:
      - main
    paths:
      - 'backend/alembic/versions/**'

jobs:
  migrate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run migrations
        working-directory: backend
        env:
          # Use manual input if provided, otherwise use secret
          DATABASE_URL: ${{ inputs.database_url || secrets.DATABASE_URL }}
        run: |
          echo "Running migrations on production database..."
          echo "Database host: $(echo $DATABASE_URL | sed 's/.*@\([^:]*\).*/\1/')"
          alembic upgrade head
          echo "✅ Migrations completed successfully"
      
      - name: Verify migration
        working-directory: backend
        env:
          DATABASE_URL: ${{ inputs.database_url || secrets.DATABASE_URL }}
        run: |
          echo "Current migration version:"
          alembic current

