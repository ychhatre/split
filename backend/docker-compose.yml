services:
  postgres:
    image: postgres:15-alpine
    container_name: split-db-local
    environment:
      POSTGRES_USER: split_user
      POSTGRES_PASSWORD: split_pass
      POSTGRES_DB: split_db
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U split_user -d split_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local

